<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Stock Deal Academy</title>
    <meta name="description" content="Stock Deal Academy admin dashboard" />

    <!-- ✅ Favicon -->
    <link rel="icon" type="image/png" href="/logo/stock-deal.png" />
    <link rel="apple-touch-icon" href="/logo/stock-deal.png" />

    <!-- ✅ Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ✅ Google Fonts (Geist Sans + Geist Mono) -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono&display=swap"
        rel="stylesheet">

    <!-- ✅ Lucide React alternative (plain JS version) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/auth.js"></script>

    <style>
        :root {
            --font-geist-sans: 'Geist', sans-serif;
            --font-geist-mono: 'Geist Mono', monospace;
        }

        body {
            font-family: var(--font-geist-sans);
        }
    </style>
</head>

<body class="antialiased bg-gray-100">

    <nav class="sticky top-0 z-50 w-full backdrop-blur bg-[#6b9bf3] text-slate-50 border-b">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3">
            <!-- 🔹 Logo -->
            <a href="index.html" class="inline-flex items-center gap-2">
                <img src="logo/stock-deal.png" alt="Stock Deal Academy Logo" class="h-9 w-auto object-contain">
                <span class="text-lg font-semibold">StockDealAcademy</span>
            </a>

            <div class="hidden md:flex gap-6 justify-center flex-1">
                <a href="index.html" class="text-base font-medium hover:text-blue-600 transition-colors">Home</a>
                <span class="text-base font-medium">Admin Dashboard</span>
            </div>

            <!-- 🔹 Desktop Auth -->
            <div id="auth-desktop" class="hidden md:flex gap-2 items-center"></div>

            <!-- 🔹 Mobile Hamburger -->
            <button id="menu-toggle"
                class="cursor-pointer p-2 rounded-md hover:bg-gray-200 transition-colors md:hidden">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
        </div>

        <div id="mobile-menu" class="hidden md:hidden px-4 pb-4">
            <div class="flex flex-col gap-1">
                <a href="index.html" class="block w-full rounded-md px-4 py-2 text-base font-medium hover:bg-gray-100">Home</a>
                <div id="auth-mobile" class="flex flex-col gap-2 mt-4"></div>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-10">
        <!-- Shown while we don't yet know if the visitor is an admin -->
        <div id="admin-checking" class="text-center text-gray-500 py-20">Checking your session...</div>

        <!-- Shown to non-admins / logged-out visitors -->
        <div id="admin-denied" class="hidden text-center py-20">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Admins only</h1>
            <p class="text-gray-600 mb-6">You need to log in with an admin account to view this page.</p>
            <a href="login.html" class="inline-block bg-orange-500 hover:bg-orange-600 text-white px-6 py-2 rounded-full">Go to Login</a>
        </div>

        <!-- Actual dashboard -->
        <div id="admin-content" class="hidden">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-3xl font-bold text-gray-800">Users</h1>
                <button id="refresh-btn"
                    class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-md text-sm">Refresh</button>
            </div>

            <div id="users-error" class="hidden mb-4 text-red-600 text-sm"></div>

            <div class="overflow-x-auto bg-white rounded-lg shadow">
                <table class="min-w-full text-sm text-left">
                    <thead class="bg-gray-50 text-gray-600 uppercase text-xs">
                        <tr>
                            <th class="px-4 py-3">Name</th>
                            <th class="px-4 py-3">Email</th>
                            <th class="px-4 py-3">Phone</th>
                            <th class="px-4 py-3">Role</th>
                            <th class="px-4 py-3">Joined</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>

            <div class="flex items-center justify-between mt-12 mb-6">
                <h2 class="text-3xl font-bold text-gray-800">Leads</h2>
            </div>

            <div id="leads-error" class="hidden mb-4 text-red-600 text-sm"></div>

            <div class="overflow-x-auto bg-white rounded-lg shadow">
                <table class="min-w-full text-sm text-left">
                    <thead class="bg-gray-50 text-gray-600 uppercase text-xs">
                        <tr>
                            <th class="px-4 py-3">Source</th>
                            <th class="px-4 py-3">Name</th>
                            <th class="px-4 py-3">Email</th>
                            <th class="px-4 py-3">Phone</th>
                            <th class="px-4 py-3">WhatsApp</th>
                            <th class="px-4 py-3">Details</th>
                            <th class="px-4 py-3">Received</th>
                        </tr>
                    </thead>
                    <tbody id="leads-table-body" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="bg-gradient-to-br from-gray-900 via-blue-900 to-purple-900 text-white mt-16">
        <div class="max-w-7xl mx-auto px-4 py-8 text-center text-sm text-gray-300">
            &copy; 2025 Stock Deal Academy. Admin Dashboard.
        </div>
    </footer>

    <script>
        lucide.createIcons();

        const menuToggle = document.getElementById("menu-toggle");
        const mobileMenu = document.getElementById("mobile-menu");

        let isOpen = false;
        menuToggle.addEventListener("click", () => {
            isOpen = !isOpen;
            mobileMenu.classList.toggle("hidden", !isOpen);
            menuToggle.innerHTML = isOpen ? '<i data-lucide="x" class="w-6 h-6"></i>' : '<i data-lucide="menu" class="w-6 h-6"></i>';
            lucide.createIcons();
        });

        const checkingEl = document.getElementById("admin-checking");
        const deniedEl = document.getElementById("admin-denied");
        const contentEl = document.getElementById("admin-content");
        const tbody = document.getElementById("users-table-body");
        const usersError = document.getElementById("users-error");

        function formatDate(iso) {
            return new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
        }

        function esc(v) {
            return (v == null ? "" : String(v))
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        const leadsBody = document.getElementById("leads-table-body");
        const leadsError = document.getElementById("leads-error");

        async function loadLeads() {
            leadsError.classList.add("hidden");
            leadsBody.innerHTML = `<tr><td class="px-4 py-3 text-gray-400" colspan="7">Loading...</td></tr>`;
            try {
                const res = await fetch(`${API_BASE}/admin/leads`, { credentials: "include" });
                const data = await res.json();
                if (!res.ok) {
                    leadsError.textContent = data.error || "Failed to load leads.";
                    leadsError.classList.remove("hidden");
                    leadsBody.innerHTML = "";
                    return;
                }
                if (data.leads.length === 0) {
                    leadsBody.innerHTML = `<tr><td class="px-4 py-3 text-gray-400" colspan="7">No leads yet.</td></tr>`;
                    return;
                }
                leadsBody.innerHTML = data.leads.map(l => {
                    const details = [l.topic, l.plan, l.message].filter(Boolean).join(" · ");
                    return `
                    <tr>
                        <td class="px-4 py-3"><span class="px-2 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-700">${esc(l.source)}</span></td>
                        <td class="px-4 py-3">${esc(l.name) || "-"}</td>
                        <td class="px-4 py-3">${esc(l.email) || "-"}</td>
                        <td class="px-4 py-3">${esc(l.phone) || "-"}</td>
                        <td class="px-4 py-3">${esc(l.whatsapp) || "-"}</td>
                        <td class="px-4 py-3 max-w-xs truncate" title="${esc(details)}">${esc(details) || "-"}</td>
                        <td class="px-4 py-3">${formatDate(l.createdAt)}</td>
                    </tr>`;
                }).join("");
            } catch (err) {
                leadsError.textContent = "Could not reach the server. Is the backend running?";
                leadsError.classList.remove("hidden");
                leadsBody.innerHTML = "";
            }
        }

        async function loadUsers() {
            usersError.classList.add("hidden");
            tbody.innerHTML = `<tr><td class="px-4 py-3 text-gray-400" colspan="5">Loading...</td></tr>`;
            try {
                const res = await fetch(`${API_BASE}/admin/users`, { credentials: "include" });
                const data = await res.json();
                if (!res.ok) {
                    usersError.textContent = data.error || "Failed to load users.";
                    usersError.classList.remove("hidden");
                    tbody.innerHTML = "";
                    return;
                }
                if (data.users.length === 0) {
                    tbody.innerHTML = `<tr><td class="px-4 py-3 text-gray-400" colspan="5">No users yet.</td></tr>`;
                    return;
                }
                tbody.innerHTML = data.users.map(u => `
                    <tr>
                        <td class="px-4 py-3">${esc(u.name)}</td>
                        <td class="px-4 py-3">${esc(u.email)}</td>
                        <td class="px-4 py-3">${esc(u.phone) || "-"}</td>
                        <td class="px-4 py-3">
                            <span class="px-2 py-1 rounded-full text-xs font-medium ${u.role === "ADMIN" ? "bg-orange-100 text-orange-700" : "bg-gray-100 text-gray-700"}">${esc(u.role)}</span>
                        </td>
                        <td class="px-4 py-3">${formatDate(u.createdAt)}</td>
                    </tr>
                `).join("");
            } catch (err) {
                usersError.textContent = "Could not reach the server. Is the backend running?";
                usersError.classList.remove("hidden");
                tbody.innerHTML = "";
            }
        }

        document.getElementById("refresh-btn").addEventListener("click", () => { loadUsers(); loadLeads(); });

        (async () => {
            const user = await initAuthUI();
            checkingEl.classList.add("hidden");

            if (!user || user.role !== "ADMIN") {
                deniedEl.classList.remove("hidden");
                return;
            }

            contentEl.classList.remove("hidden");
            loadUsers();
            loadLeads();
        })();
    </script>

</body>

</html>
